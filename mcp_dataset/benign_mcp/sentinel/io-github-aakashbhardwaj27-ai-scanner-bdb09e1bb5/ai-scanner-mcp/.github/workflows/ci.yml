name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Verify import resolves
        run: node -e "import('./index.js').then(() => console.log('✅ Module loads successfully')).catch(e => { console.error(e); process.exit(1); })"

      - name: Verify bin entry point
        run: node --input-type=module -e "import { createRequire } from 'module'; const require = createRequire(import.meta.url); const pkg = require('./package.json'); console.log('bin:', pkg.bin); console.log('✅ Package metadata valid');"
