[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clickhouse-dataops-mcp"
version = "0.1.1"
description = "A DataOps-focused MCP server for ClickHouse with query optimization, pipeline latency analysis, and data quality monitoring"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    { name = "Junsu Lee", email = "aguantar@users.noreply.github.com" },
]
keywords = [
    "mcp",
    "clickhouse",
    "dataops",
    "data-engineering",
    "query-optimization",
    "pipeline-monitoring",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.0.0",
    "clickhouse-connect>=0.7.0",
]

[project.urls]
Homepage = "https://github.com/Aguantar/clickhouse-mcp-server"
Repository = "https://github.com/Aguantar/clickhouse-mcp-server"
Issues = "https://github.com/Aguantar/clickhouse-mcp-server/issues"

[project.scripts]
clickhouse-mcp-server = "clickhouse_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clickhouse_mcp"]

[tool.hatch.build.targets.wheel.shared-data]

[tool.hatch.metadata]
license-files = []
