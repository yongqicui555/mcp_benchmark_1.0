[project]
name = "mcp-benchmark"
version = "1.0.0rc1"
description = "MCP research dataset and researcher-directed harness plus LLM construction artifacts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43.0.0",
    "mcp>=1.0.0",
    "openai>=1.0.0",
    "pyyaml>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["construction/tests", "benchmark/tests"]
pythonpath = ["construction", "."]

[tool.uv]
package = false
